    --hairline: #eaebe5;
    --green: #94f27f;

    --green-ink-hover: #0a5f12;

    align-items: center;
    gap: 8px;
    background: var(--ink-deep);
    color: var(--green);
    font-family: var(--font-mono);
    font-size: 0.95rem;
    font-weight: 500;
    padding: 12px 22px;
    border-radius: var(--radius);
    text-decoration: none;
    transition: background 0.15s ease;
    margin: 12px 0 4px;
  }
  .btn:hover { background: #000; color: var(--green); }
